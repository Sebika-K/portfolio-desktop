# Keeps the free Supabase project awake.
# Free projects pause after 7 days with no activity, which would break the
# guestbook. This asks the database one tiny question every 3 days so it
# never counts as inactive. Runs on GitHub's servers — nothing to keep open.

name: Keep Supabase awake

on:
  schedule:
    # "minute hour day-of-month month day-of-week", in UTC:
    # 14:00 UTC (≈ 9 AM Central) on every 3rd day of the month.
    - cron: "0 14 */3 * *"
  # Also adds a "Run workflow" button on GitHub, so you can test it by hand.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database for one approved entry
        # --fail makes the job turn red (and GitHub emails you) if it errors.
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/guestbook_entries?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -o /dev/null
          echo "Supabase is awake ✿"
